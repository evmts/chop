name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: bun run build
      - run: node scripts/check-package.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="$(npm pack --ignore-scripts --silent)"
          gh release create "$GITHUB_REF_NAME" "$package" --verify-tag --generate-notes
